openapi: 3.0.3
info:
  title: PoshivOn Costing API
  version: 1.0.0
  description: API для настройки пользовательских правил ценообразования и расчета стоимости партии в чатах.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Healthcheck
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  # Маршруты владельца данных. Сегмента {userID} в адресе нет намеренно: владелец берётся из
  # сессии (Decision 6), поэтому обратиться к чужим данным через адрес нельзя в принципе.
  # Отсюда же 401/403 на каждой операции — префикс закрыт цепочкой
  # RequireSameOrigin → RequireAuth → RequireAccess.
  /api/v1/users/settings:
    post:
      summary: Create or update pricing settings of the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '204':
          description: Settings saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: Get pricing settings of the authenticated user
      responses:
        '200':
          description: Settings returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/chats:
    post:
      summary: Create chat for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChatInput'
      responses:
        '201':
          description: Chat created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    get:
      summary: List chats of the authenticated user
      responses:
        '200':
          description: Chats returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chat'
                required: [items]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/chats/{chatID}/calculate:
    parameters:
      - in: path
        name: chatID
        required: true
        schema:
          type: string
    post:
      summary: Calculate order cost in chat and persist result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '200':
          description: Calculation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/chats/{chatID}/calculations:
    parameters:
      - in: path
        name: chatID
        required: true
        schema:
          type: string
    get:
      summary: List saved calculations for a chat
      responses:
        '200':
          description: Calculations returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CalculationResult'
                required: [items]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/market-feedback:
    post:
      summary: Analyze calculation parameters with DeepSeek and estimate RU-market fit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                garment_type:
                  type: string
                material_type:
                  type: string
                market_segment:
                  type: string
                urgency:
                  type: string
                quantity:
                  type: integer
                fittings:
                  type: integer
                is_custom_figure:
                  type: boolean
                is_child:
                  type: boolean
                operation_counts:
                  type: object
                  additionalProperties:
                    type: integer
                comment:
                  type: string
              required: [quantity]
      responses:
        '200':
          description: Image analysis result
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: DeepSeek rate limit exceeded
        '503':
          description: DeepSeek integration unavailable

  # Контур доступа. /api/v1/access/ закрыт только RequireAuth: сюда обращается именно тот,
  # у кого доступа ещё нет, — иначе заявку было бы невозможно подать.
  /api/v1/access/me:
    get:
      summary: Access state of the authenticated user
      description: >-
        has_access — итоговое право (Decision 10): администратор со снятым флагом видит
        рабочий интерфейс. contact_email приходит из конфигурации сервера (CONTACT_EMAIL).
      responses:
        '200':
          description: Access state returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessState'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/access/requests:
    post:
      summary: Submit an access request on behalf of the authenticated user
      description: >-
        Тела у запроса нет: заявитель — это владелец сессии. Логин в теле позволил бы подать
        заявку от чужого имени (US-15).
      responses:
        '201':
          description: Request created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  # /api/v1/admin/ дополнительно закрыт RequireAdmin: роль решает всё, флаг has_access здесь
  # ни при чём.
  /api/v1/admin/users:
    get:
      summary: List all users with their roles, access flags and request statuses
      responses:
        '200':
          description: Users returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserRecord'
                required: [items]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{login}/access:
    parameters:
      - in: path
        name: login
        required: true
        schema:
          type: string
    post:
      summary: Grant or revoke access for a user
      description: >-
        Кто принял решение, берётся из сессии администратора, а не из тела запроса.
        Отсутствующее поле granted — 400, а не «снять доступ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAccessInput'
      responses:
        '204':
          description: Access flag updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    BatchDiscount:
      type: object
      properties:
        min_qty:
          type: integer
          minimum: 1
          example: 11
        max_qty:
          type: integer
          minimum: 1
          example: 50
        percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 5
      required: [min_qty, max_qty, percent]

    UserSettings:
      type: object
      properties:
        base_prices:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            Пиджак: 5000
            Юбка: 2000
            Рубашка: 3000
        surcharge_percent:
          type: object
          additionalProperties:
            type: number
            format: float
          example:
            Карман: 20
            Трудная ткань: 20
            Молния: 20
        batch_discounts:
          type: array
          items:
            $ref: '#/components/schemas/BatchDiscount'
      required: [base_prices, surcharge_percent, batch_discounts]

    OrderInput:
      type: object
      properties:
        garment_type:
          type: string
          example: Пиджак
        complications:
          type: array
          items:
            type: string
          example: [Карман, Карман, Трудная ткань]
        quantity:
          type: integer
          minimum: 1
          example: 15
      required: [garment_type, complications, quantity]

    CreateChatInput:
      type: object
      properties:
        title:
          type: string
          example: Партия пиджаков

    Chat:
      type: object
      properties:
        user_id:
          type: string
        id:
          type: string
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        calculations_count:
          type: integer
      required: [user_id, id, title, created_at, updated_at, calculations_count]

    AppliedSurcharge:
      type: object
      properties:
        name:
          type: string
        percent:
          type: integer
          format: int64
        amount:
          type: integer
          format: int64
        repeats:
          type: integer
        per_unit:
          type: boolean
        calc_basis:
          type: string
      required: [name, percent, amount, repeats, per_unit, calc_basis]

    CalculationResult:
      type: object
      properties:
        user_id:
          type: string
        chat_id:
          type: string
        garment_type:
          type: string
        quantity:
          type: integer
        base_price_per_unit:
          type: integer
          format: int64
        surcharge_per_unit:
          type: integer
          format: int64
        price_per_unit:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
        discount_percent:
          type: integer
          format: int64
        discount_amount:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        applied_surcharges:
          type: array
          items:
            $ref: '#/components/schemas/AppliedSurcharge'
        applied_discount_min:
          type: integer
        applied_discount_max:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        [user_id, chat_id, garment_type, quantity, base_price_per_unit, surcharge_per_unit,
         price_per_unit, subtotal, discount_percent, discount_amount, total,
         applied_surcharges, applied_discount_min, applied_discount_max, created_at]

    Role:
      type: string
      enum: [user, admin]

    UserRecord:
      type: object
      properties:
        login:
          type: string
        display_name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        has_access:
          type: boolean
          description: Сырой флаг колонки, без учёта роли — админскую галочку клиент рисует по role.
        request_status:
          type: string
          enum: ['', pending, approved, rejected]
        requested_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [login, display_name, email, role, has_access, request_status]

    AccessState:
      type: object
      properties:
        login:
          type: string
        display_name:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        has_access:
          type: boolean
          description: Итоговое право — has_access || role == admin (Decision 10).
        request_status:
          type: string
          enum: ['', pending, approved, rejected]
        contact_email:
          type: string
      required: [login, display_name, email, role, has_access, request_status, contact_email]

    SetAccessInput:
      type: object
      properties:
        granted:
          type: boolean
      required: [granted]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >-
        Сессия отсутствует или не опознана. Тело содержит машиночитаемый код причины
        (access_cookie_missing, refresh_cookie_missing, session_not_found, session_expired,
        access_expired, access_mismatch, session_identity_missing) — на нём построен повтор
        запроса на клиенте.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Доступ не выдан, роли недостаточно или запрос пришёл не с нашей страницы.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Заявка уже на рассмотрении либо доступ уже выдан.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
